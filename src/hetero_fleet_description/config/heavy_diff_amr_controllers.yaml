/<robot_name>/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
/<robot_name>/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
/<robot_name>/diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names:
    - left_wheel_joint
    right_wheel_names:
    - right_wheel_joint
    wheel_separation: 0.423249735
    wheel_radius: 0.089105207
    publish_rate: 50.0
    tf_frame_prefix_enable: false
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    pose_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.01
    twist_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.01
    open_loop: true
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.65
        min_velocity: -0.2
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 0.8
        min_velocity: -0.8
        has_acceleration_limits: true
        max_acceleration: 1.2
        min_acceleration: -1.2
